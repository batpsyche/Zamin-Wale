services:
  db:
    image: postgres:16-alpine
    container_name: zaminwale-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zaminwale
      POSTGRES_PASSWORD: zaminwale_secret
      POSTGRES_DB: zaminwale
    ports:
      - "5433:5432"
    volumes:
      - zaminwale_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaminwale -d zaminwale"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  zaminwale_pgdata:
